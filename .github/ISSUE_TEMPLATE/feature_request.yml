name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目坚持纯离线、无账号、无广告。涉及联网、云同步、社交的提案通常不会被接受。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      placeholder: 现在哪里不方便？在什么场景下？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不需要联网、账号或云端
          required: true
        - label: 方案不新增危险权限
          required: true

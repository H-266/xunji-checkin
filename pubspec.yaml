name: xunji_checkin
description: "循记打卡：纯离线打卡、热力日历、桌面小组件、统计与本地备份"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 宣传片素材导出用：在 flutter test 里跑真实 SQLite(ffi) + 真实 TaskProvider
  sqflite_common_ffi: ^2.3.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
    - assets/support/wechat_pay.png
    - assets/support/alipay_pay.jpg
